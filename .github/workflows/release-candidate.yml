name: Release candidate gates

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate-gates:
    name: Python 3.11 fail-closed gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install clean dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile application, migrations, scripts, and tests
        run: python -m compileall -q bot alembic scripts tests

      - name: Verify fresh and 0005-to-head migrations and application startup
        run: python -m pytest -vv -p no:cacheprovider tests/test_release_migrations.py

      - name: Verify backup, restore, retention, RPO, RTO, and rollback contracts
        run: |
          bash -n deploy/moira-backup.sh deploy/moira-restore-drill.sh
          python -m pytest -vv -p no:cacheprovider tests/test_backup_restore.py

      - name: Verify 78 cards, assets, fonts, glyphs, and renderers
        run: python -m pytest -vv -p no:cacheprovider tests/test_cards_78.py tests/test_release_assets.py

      - name: Verify governing manifest and evaluator contracts
        run: >-
          python -m pytest -vv -p no:cacheprovider
          tests/test_governing_eval_candidate_b_contract.py
          tests/test_governing_eval_candidate_c_contract.py
          tests/test_oracle_eval_spread_contract.py
          tests/test_oracle_p0_3_adversarial_contract.py
          tests/test_sol_oracle_gate_regressions.py
          tests/test_llm_schema.py
          tests/test_llm_trust_boundary.py
          tests/test_oracle_voice_contract.py
          tests/test_llm_retry_policy.py

      - name: Run full test suite
        run: python -m pytest -ra -p no:cacheprovider

      - name: Reject whitespace errors and generated tracked changes
        shell: bash
        run: |
          base="$(git merge-base origin/main HEAD)"
          git diff --check "$base"..HEAD
          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Scan tracked sources and remote configuration for credentials
        run: python scripts/check_release_secrets.py --repo .

      - name: Create sanitized exact-SHA artifact manifest
        run: >-
          python scripts/create_release_artifact_manifest.py
          --output "${{ runner.temp }}/moira-release/candidate-manifest.json"

      - name: Upload sanitized release manifest
        uses: actions/upload-artifact@v4
        with:
          name: moira-candidate-${{ github.sha }}
          path: |
            ${{ runner.temp }}/moira-release/candidate-manifest.json
            ${{ runner.temp }}/moira-release/candidate-manifest.json.sha256
          if-no-files-found: error
          retention-days: 30
