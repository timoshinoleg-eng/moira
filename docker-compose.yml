name: moira

x-postgres-env: &postgres-env
  POSTGRES_USER: ${POSTGRES_USER:-moira}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moira}
  POSTGRES_DB: ${POSTGRES_DB:-moira}

x-bot-build: &bot-build
  context: .
  dockerfile: Dockerfile

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      <<: *postgres-env
    # No host port by default: only bot/backup services reach the DB over the
    # compose network. To run the restore-drill or verify tooling from the host,
    # publish a port explicitly, e.g. -p 127.0.0.1:6432:5432 (do not expose to 0.0.0.0).
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-moira} -d ${POSTGRES_DB:-moira}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot schema bootstrap: init_db on PostgreSQL only runs SELECT 1, so the
  # bot must not start before Alembic has applied the schema. Idempotent.
  migrate:
    build: *bot-build
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-moira}:${POSTGRES_PASSWORD:-moira}@db:5432/${POSTGRES_DB:-moira}
    entrypoint: ["/app/.venv/bin/python", "-m", "alembic", "upgrade", "head"]
    healthcheck:
      disable: true

  bot:
    build: *bot-build
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?BOT_TOKEN must be set}
      ADMIN_IDS: ${ADMIN_IDS:-}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-moira}:${POSTGRES_PASSWORD:-moira}@db:5432/${POSTGRES_DB:-moira}
      # Writable runtime dir for the single-instance lock (code dir is read-only).
      MOIRA_LOCK_DIR: /var/lib/moira
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_POOL_MAX_OVERFLOW: ${DB_POOL_MAX_OVERFLOW:-10}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LLM_API_KEY_FILE: ${LLM_API_KEY_FILE:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek/deepseek-v4-flash}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      LLM_RETRY_POLICY_V2: ${LLM_RETRY_POLICY_V2:-false}
      LLM_CONTROLLED_REPAIR_ENABLED: ${LLM_CONTROLLED_REPAIR_ENABLED:-false}
      LLM_V2_PRIMARY_TIMEOUT_SEC: ${LLM_V2_PRIMARY_TIMEOUT_SEC:-12}
      LLM_V2_TOTAL_TIMEOUT_SEC: ${LLM_V2_TOTAL_TIMEOUT_SEC:-18}
      LLM_V2_MAX_ATTEMPTS: ${LLM_V2_MAX_ATTEMPTS:-2}
      BOT_DISPLAY_NAME: ${BOT_DISPLAY_NAME:-Мойра}
      FREE_READINGS: ${FREE_READINGS:-10}
      EARLYBIRD_LIMIT: ${EARLYBIRD_LIMIT:-50}
      EARLYBIRD_BONUS: ${EARLYBIRD_BONUS:-3}
      REFERRAL_REWARD: ${REFERRAL_REWARD:-2}
      POSTHOG_API_KEY: ${POSTHOG_API_KEY:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-https://eu.i.posthog.com}
      SENTRY_DSN: ${SENTRY_DSN:-}
      DEEPGRAM_STT_ENABLED: ${DEEPGRAM_STT_ENABLED:-false}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      DEEPGRAM_STT_MODEL: ${DEEPGRAM_STT_MODEL:-nova-3}
    volumes:
      - moira-data:/var/lib/moira
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-m", "bot._healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  backup:
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-moira}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moira}
      POSTGRES_DB: ${POSTGRES_DB:-moira}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_KEEP_WEEKS: 0
      BACKUP_KEEP_MONTHS: 0
      POSTGRES_EXTRA_OPTS: -Z9 --schema=public --blobs
    volumes:
      - ./backups:/backups

volumes:
  pgdata:
  moira-data: