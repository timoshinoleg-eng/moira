[project]
name = "moira"
version = "1.0.0"
description = "Moira — bilingual (RU/EN) AI tarot oracle Telegram bot"
requires-python = ">=3.11,<3.12"
dependencies = [
    "aiogram==3.30.0",
    "SQLAlchemy==2.0.52",
    "aiosqlite==0.22.1",
    "httpx==0.28.1",
    "python-dotenv==1.2.2",
    "edge-tts==7.2.8",
    "Pillow==12.3.0",
    "alembic==1.18.5",
    "instructor==1.15.4",
    "tenacity==9.1.4",
    "openai==2.53.0",
    "posthog==7.37.0",
    "sentry-sdk==2.66.1",
    "pydantic==2.13.4",
    "tzdata==2026.3",
    "PyYAML==6.0.3",
    "asyncpg==0.30.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "testcontainers[postgres]==4.12.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]